<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Say Watt Robotics</title>
  <meta name="description" content="Say Watt Robotics — a student robotics program in Madison, AL. Home of our MATE ROV and FIRST LEGO League teams." />
  <link rel="icon" type="image/png" href="assets/logo-emblem.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-team="home">

  <!-- ===== Navigation ===== -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html" data-logo>Say Watt Robotics</a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span>
      </button>
      <nav class="nav-links" id="navLinks">
        <div class="team-tabs">
          <a href="MATEROV.html" data-team-tab="rov">ROV Team</a>
          <a href="fll.html" data-team-tab="fll">FIRST LEGO League</a>
        </div>
        <a href="#sponsors" class="nav-donate" data-donate>Sponsors</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <section class="hero" id="hero"></section>

    <section class="section" id="teams">
      <div class="wrap">
        <p class="eyebrow">Our Teams</p>
        <h2 class="section-title">Pick a team to explore.</h2>
        <div id="teamGrid" class="team-grid"></div>
      </div>
    </section>

    <!-- ===== Sponsors ===== -->
    <section class="section section-alt" id="sponsors">
      <div class="wrap">
        <p class="eyebrow">Sponsors</p>
        <h2 class="section-title">Made possible by.</h2>
        <p class="section-lede" id="sponsorLede"></p>
        <div id="sponsorList" class="sponsor-grid"></div>
        <div id="fundingBlock"></div>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="wrap" id="footerInner"></div>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>

</html>
